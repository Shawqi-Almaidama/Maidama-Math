name: Build Maidama Math Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release-unsigned)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build
        env:
          VITE_API_BASE_URL: https://ais-pre-namjaksavbwi5o3ufsnimf-234764102414.europe-west2.run.app

      - name: Sync Web Assets with Capacitor Android
        run: npx cap sync android

      - name: Grant Executable Permission to Gradle Wrapper
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        if: "${{ github.event.inputs.build_type != 'release-unsigned' }}"
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build Android Unsigned Release APK
        if: "${{ github.event.inputs.build_type == 'release-unsigned' }}"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        if: "${{ github.event.inputs.build_type != 'release-unsigned' }}"
        uses: actions/upload-artifact@v4
        with:
          name: maidama-math-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload Release APK Artifact
        if: "${{ github.event.inputs.build_type == 'release-unsigned' }}"
        uses: actions/upload-artifact@v4
        with:
          name: maidama-math-release-unsigned-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 14
